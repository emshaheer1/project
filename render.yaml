# Alpha Polymers — Render API (Postgres lives on Supabase)
# Set DATABASE_URL (pooler) and DIRECT_URL (direct) from Supabase in the dashboard.
# Frontend deploys separately on Vercel; set FRONTEND_URL to that domain for CORS.

services:
  - type: web
    name: apollo-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # releaseCommand runs once per deploy (not on free-tier wakeups).
    # startCommand must stay fast — cold starts only run this.
    preDeployCommand: npx prisma db push && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOW_DEMO_CHECKOUT
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
